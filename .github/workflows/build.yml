name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project DwellApp.xcodeproj \
            -scheme DwellApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Create IPA
        run: |
          find build/derived -name "*.app" -type d
          APP=$(find build/derived -name "*.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build && zip -r DwellApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DwellApp
          path: build/DwellApp.ipa
