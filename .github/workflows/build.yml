name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project DwellApp.xcodeproj \
            -scheme DwellApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/DwellApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DwellApp.xcarchive/Products/Applications/DwellApp.app build/Payload/
          cd build && zip -r DwellApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DwellApp
          path: build/DwellApp.ipa
