name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List Xcode
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild -project DwellApp.xcodeproj \
            -scheme DwellApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/DwellApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -80

      - name: Create IPA
        run: |
          APP=$(find build/DwellApp.xcarchive -name "*.app" -type d | head -1)
          echo "Found app at: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build && zip -r DwellApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DwellApp
          path: build/DwellApp.ipa
